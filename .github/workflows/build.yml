# Builds the pinned image, runs the reference CLI smoke test, `make verify`
# (crypto self-test, CSV schema, exact sizes, verification paths, cache replay)
# and `make test` (run-directory safety and report integrity).
# Timings from shared runners are never reported; final measurements come from
# one fixed environment (see README, "Running the benchmark").

name: build-and-verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build pinned image (OpenSSL 3.6.0, liboqs 0.16.0, MTL v1.3.1)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: ladderlens:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test with the reference CLI tools
        run: make smoke

      - name: Verify harness, sizes, cache replay and DNS encoding
        run: make verify

      - name: Unit tests (run-directory safety, report integrity)
        run: make test

      - name: Keep verification output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-output
          path: results/verify/
          if-no-files-found: ignore
